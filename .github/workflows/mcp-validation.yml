name: Embedded MCP validation (no release)
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - name: Build the terminal test dependency on Linux
        if: runner.os == 'Linux'
        run: npm rebuild node-pty --ignore-scripts=false
        working-directory: webui
      - run: npm test
        working-directory: webui
      - run: npm audit --audit-level=moderate
        working-directory: webui
      - run: node tests/image_api_smoke.cjs
        working-directory: webui
      - name: Resident console HTTP/lifecycle and actual terminal input
        working-directory: webui
        run: |
          node tests/server_console_smoke.cjs
          node tests/server_console_pty.cjs --artifacts ../build_console_qa
      - run: node tools/build-mcp-package.cjs
        working-directory: webui
      - name: Packaged HTTP and stdio without Node on the child PATH
        shell: bash
        working-directory: webui
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=../build_mcp/webui-server.exe; else EXE=../build_mcp/webui-server; fi
          node tests/packaged_mcp_smoke.cjs --exe "$EXE"
          node tests/image_api_smoke.cjs --exe "$EXE"
          node tests/server_console_smoke.cjs --exe "$EXE"
          node tests/server_console_pty.cjs --exe "$EXE" --artifacts ../build_console_qa
      - name: Terminal acceptance transcripts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: console-transcripts-${{ matrix.os }}
          path: build_console_qa/*console-pty.txt
          if-no-files-found: ignore
