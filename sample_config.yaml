# OpenMagFDM v1.6.1 sample configuration
#
# This file is intentionally conservative: it runs as a static, linear polar
# analysis after the RGB values are adjusted to match the input image. For the
# complete key reference and transient/DD examples, see docs/CONFIGURATION.md.

coordinate_system: polar

# Optional OpenMP limit. Omit or use 0 for automatic selection. Windows uses
# physical cores by default because SMT commonly slows memory-bound AMG work;
# an explicit value or OMP_NUM_THREADS still overrides it.
omp:
  threads: 0

# Cartesian only. Ignored when coordinate_system is polar.
mesh:
  dx: 0.2e-3
  dy: 0.2e-3

# Physical radii are always metres. Image pixels along the r-axis map linearly
# to [r_start, r_end]. r_start may be 0 for a full disc, but then the inner
# boundary must be Dirichlet.
polar_domain:
  r_start: 0.2
  r_end: 0.3
  r_orientation: horizontal   # horizontal: columns=r; vertical: rows=r
  theta_range: pi/6

polar_boundary_conditions:
  inner: { type: dirichlet, value: 0.0 }
  outer: { type: dirichlet, value: 0.0 }
  theta_min: { type: periodic, value: 1.0 }
  theta_max: { type: periodic, value: 1.0 }

# Cartesian boundary example (used only with coordinate_system: cartesian).
boundary_conditions:
  left: { type: dirichlet, value: 0.0 }
  right: { type: dirichlet, value: 0.0 }
  bottom: { type: periodic, value: 1.0 }
  top: { type: periodic, value: 1.0 }

variables:
  J_peak: 1.0e6
  N_step: 12

# Exact RGB matching is used unless anti_aliasing is enabled for a material.
materials:
  air:
    rgb: [255, 255, 255]
    mu_r: 1.0
    jz: 0.0
    calc_force: false

  iron:
    rgb: [128, 128, 128]
    mu_r: 1000.0
    jz: 0.0
    calc_force: true

  coil_positive:
    rgb: [255, 0, 0]
    mu_r: 1.0
    jz: $J_peak*cos(2*pi*$step/$N_step)

  coil_negative:
    rgb: [128, 0, 0]
    mu_r: 1.0
    jz: -$J_peak*cos(2*pi*$step/$N_step)

# Enable this block when a material uses a B-H curve/formula. Eisenstat-Walker
# is the v1.6.1 recommendation for nonlinear runs.
nonlinear_solver:
  enabled: false
  solver_type: newton-krylov
  max_iterations: 100
  tolerance: 1.0e-3
  eisenstat_walker:
    enabled: true
    gamma: 0.9
    alpha: 2.0
    eta_min: 1.0e-6
    eta_max: 0.1
  verbose: false
  export_convergence: true

# Static by default. For band bounds, a decimal literal means physical metres;
# an integer literal retains the legacy pixel-index meaning.
transient:
  enabled: false
  enable_sliding: true
  total_steps: $N_step
  parallel_chunks: 1
  slides:
    - name: rotor
      kind: band
      direction: vertical
      region_start: 0.22       # [m] because this is a decimal literal
      region_end: 0.25         # [m]
      pixels_per_step: 1
      wrap_mode: auto
  export_fields: [Az, Mu, H, Jz, InputImg, Forces, EnergyDensity]

# Optional polar accuracy mode. Keep the air gap, magnets, coils and saturated
# teeth in cf=1 bands; place interfaces inside iron. Disabled unless both
# enabled=true and at least one band are supplied.
# domain_decomposition:
#   enabled: true
#   bands:
#     - [0, 52, 4, 4]
#     - [52, 330, 1, 1]
#     - [330, 450, 4, 4]
#   robin_p: 12.0
#   overlap: 4
#   max_outer: 8
#   max_inner: 3
#   tol: 1.0e-3

# Default result format is lossless float64 TIFF written asynchronously.
export:
  format: tiff          # tiff | csv | both
  precision: double     # double | float
  async: true
  async_queue_depth: 2
  tiff:
    compression: deflate
    predictor: 3
