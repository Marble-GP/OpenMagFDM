# IEEJ-D 450 x 2976 fixed-grid reference; thread count comes from OMP_NUM_THREADS.
coordinate_system: polar
polar_domain:
  r_start: 0.0050633
  r_end: 0.1
  r_orientation: horizontal
  theta_range: 2*pi
polar_boundary_conditions:
  inner: {type: dirichlet, value: 0}
  outer: {type: dirichlet, value: 0}
  theta_min: {type: periodic, value: 1}
  theta_max: {type: periodic, value: 1}
transient:
  enabled: true
  enable_sliding: true
  total_steps: 12
  parallel_chunks: 1
  slide_direction: vertical
  slide_region_start: 0
  slide_region_end: 212
  slide_pixels_per_step: 12
material_presets:
  pure_iron_model:
    B-H: ($H/(40 + 0.52*$H) + 4*pi*1e-7*$H) * (1.0/(1.0 + exp(-0.1*($H - 40))))
  NdFeB_N40:
    mu_r: 1.05
    magnetization:
      Br: 1.27
      pattern: parallel
      angle: 0
materials:
  material_92989e:
    rgb: [146, 152, 158]
    preset: pure_iron_model
  material_f7f7f7:
    rgb: [247, 247, 247]
    mu_r: 1
    jz: 0
  material_d072a7:
    rgb: [208, 114, 167]
    preset: NdFeB_N40
    magnetization:
      pattern: parallel_array
      p: 4
      angle: 0
      cx: 0
      cy: 0
      direction: outward
      orientation_offset: -45
  material_000000:
    rgb: [0, 0, 0]
    mu_r: 1
    jz: 0
  coil_C_neg_253f70:
    rgb: [37, 63, 112]
    mu_r: 1
    jz: 0
  coil_C_pos_3a6ccf:
    rgb: [58, 108, 207]
    mu_r: 1
    jz: 0
  coil_B_pos_3ad052:
    rgb: [58, 208, 82]
    mu_r: 1
    jz: 0
  coil_B_neg_257030:
    rgb: [37, 112, 48]
    mu_r: 1
    jz: 0
  coil_A_pos_d0533a:
    rgb: [208, 83, 58]
    mu_r: 1
    jz: 0
  coil_A_neg_703025:
    rgb: [112, 48, 37]
    mu_r: 1
    jz: 0
flux_linkage:
  - {name: Phi_Coil_A, material_a: coil_A_pos_d0533a, material_b: coil_A_neg_703025}
  - {name: Phi_Coil_B, material_a: coil_B_pos_3ad052, material_b: coil_B_neg_257030}
  - {name: Phi_Coil_C, material_a: coil_C_pos_3a6ccf, material_b: coil_C_neg_253f70}
nonlinear_solver:
  enabled: true
  solver_type: newton-krylov
  verbose: true
  tolerance: 1.0e-3
  max_iterations: 300
  anderson: {enabled: false}
  eisenstat_walker:
    enabled: true
    gamma: 0.9
    alpha: 2.0
    eta_min: 1.0e-6
    eta_max: 0.1
export:
  format: tiff
  precision: double
