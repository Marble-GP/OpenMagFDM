<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenMagFDM — Login</title>
<body style="font:16px system-ui;max-width:28rem;margin:12vh auto;padding:2rem;background:#f5f7fa;color:#172c41">
<h1>OpenMagFDM</h1><p>Sign in to the shared server</p><form id="loginForm">
<label>Username <input name="name" autocomplete="username" required style="display:block;width:100%"></label><br>
<label>Password <input name="password" type="password" autocomplete="current-password" required style="display:block;width:100%"></label><br>
<label><input name="remember" type="checkbox">Remember this device for 30 days</label><br><br><button>Sign in</button>
</form><p id="status" role="status"></p><script src="/login.js"></script></body></html>
