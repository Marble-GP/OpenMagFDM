<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenMagFDM — Login</title>
<body style="font:16px system-ui;max-width:28rem;margin:12vh auto;padding:2rem;background:#f5f7fa;color:#172c41">
<h1>OpenMagFDM</h1><p>共有サーバーにログイン</p><form id="loginForm">
<label>ユーザー名 <input name="name" autocomplete="username" required style="display:block;width:100%"></label><br>
<label>パスワード <input name="password" type="password" autocomplete="current-password" required style="display:block;width:100%"></label><br>
<label><input name="remember" type="checkbox">この端末を30日間記憶</label><br><br><button>ログイン</button>
</form><p id="status" role="status"></p><script src="/login.js"></script></body></html>
