# Anti-periodic BC test: half circle theta in [0, pi] with anti-periodic
# theta-BC and ONE coil -- +jz at theta=45 deg. compare_az.py reconstructs
# the full-circle field by mirror-and-negate and checks it against
# full_circle_ref.yaml's output.

coordinate_system: polar

polar_domain:
  r_start: 0.01
  r_end:   0.05
  r_orientation: horizontal
  theta_range: pi

# Same Dirichlet on r as the reference. ANTI-periodic on theta:
# value = -1.0 selects the matrix-build-time sign-flip path.
polar_boundary_conditions:
  inner:
    type: dirichlet
    value: 0.0
  outer:
    type: dirichlet
    value: 0.0
  theta_min:
    type: periodic
    value: -1.0       # anti-periodic
  theta_max:
    type: periodic
    value: -1.0

materials:
  air:
    rgb: [255, 255, 255]
    mu_r: 1.0
    jz: 0.0

  coil_pos:
    rgb: [255, 0, 0]
    mu_r: 1.0
    jz: 1.0e6        # +1e6 A/m^2 (same position as in the reference)

nonlinear_solver:
  enabled: false
