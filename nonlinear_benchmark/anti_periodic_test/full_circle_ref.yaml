# Anti-periodic BC reference: full circle theta in [0, 2pi] with periodic
# theta-BC and TWO coils -- +jz at theta=45 deg, -jz at theta=225 deg.
# This is the field the half-circle AP-BC solve is expected to reproduce
# (up to the sign flip applied during reconstruction in compare_az.py).

coordinate_system: polar

polar_domain:
  r_start: 0.01
  r_end:   0.05
  r_orientation: horizontal
  theta_range: 2*pi

# Dirichlet on r_min / r_max so the field has somewhere to go to zero.
# Periodic on theta (value = +1.0) -- this is the reference.
polar_boundary_conditions:
  inner:
    type: dirichlet
    value: 0.0
  outer:
    type: dirichlet
    value: 0.0
  theta_min:
    type: periodic
    value: 1.0
  theta_max:
    type: periodic
    value: 1.0

materials:
  air:
    rgb: [255, 255, 255]
    mu_r: 1.0
    jz: 0.0

  coil_pos:
    rgb: [255, 0, 0]
    mu_r: 1.0
    jz: 1.0e6        # +1e6 A/m^2

  coil_neg:
    rgb: [0, 255, 0]
    mu_r: 1.0
    jz: -1.0e6       # -1e6 A/m^2 (the "ghost" the AP-BC would have generated)

# Single static step -- no transient.
nonlinear_solver:
  enabled: false
